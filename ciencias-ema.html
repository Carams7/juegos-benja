<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>Laboratorio Verde · Fotosíntesis y tramas tróficas</title>
<style>
:root{--ink:#16302b;--muted:#5b716b;--bg:#eef6f1;--card:#fff;--green:#1f8a4c;--green2:#2fb36b;--teal:#0e7c86;--leaf:#0f5132;
--amber:#f0a202;--red:#d64545;--line:#d6e6dc;--soft:#e4f3ea;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
background:linear-gradient(180deg,#dff1e6 0,#eef6f1 220px,#f5faf7 100%);min-height:100vh;min-height:100dvh;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation}
h1{font-size:1.7rem;margin:0;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 6px}
h3{font-size:1.05rem;margin:12px 0 4px;color:var(--leaf)}
p{margin:6px 0;line-height:1.45}
.hero{background:linear-gradient(135deg,#0f5132,#1f8a4c 60%,#0e7c86);color:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:0 8px 24px rgba(15,81,50,.25);position:relative;overflow:hidden}
.hero .tag{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:700}
.hero p{opacity:.92;font-size:.98rem}
.hero .deco{position:absolute;right:-8px;top:-10px;font-size:5.5rem;opacity:.18;transform:rotate(18deg)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(20,60,40,.08);border:1px solid var(--line)}
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:74px;box-shadow:0 3px 0 #cfe3d7;transition:transform .08s}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #cfe3d7}
.mbtn .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:0 0 auto}
.mbtn .tx{flex:1}
.mbtn b{display:block;font-size:1.08rem}
.mbtn small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.mbtn .best{font-size:.8rem;color:var(--green);font-weight:700;white-space:nowrap}
.c1{background:#e3f6e9}.c2{background:#e6f1fb}.c3{background:#fdf0dc}.c4{background:#efe8fb}.c5{background:#dff3f4}.c6{background:#fde6e6}.c0{background:#fff7d6}
.top{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 8px;border:1px solid var(--line)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--soft);font-size:1.25rem;display:flex;align-items:center;justify-content:center}
.top .mid{flex:1;font-weight:700;font-size:.98rem;text-align:center;line-height:1.2}
.chip{background:var(--soft);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.95rem;white-space:nowrap}
.chip.fire{background:#fff1d6;color:#9a5b00}
.prog{height:8px;background:#e2ece6;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--teal));transition:width .3s}
.qnum{font-size:.82rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prompt{font-size:1.18rem;font-weight:650;line-height:1.4;margin:6px 0 4px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1.02rem;line-height:1.3;min-height:52px;font-weight:550}
.opt:active{background:var(--soft)}
.opt.ok{border-color:var(--green);background:#e3f6e9}
.opt.bad{border-color:var(--red);background:#fdeaea}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.98rem;line-height:1.45;animation:up .25s ease-out}
.fb.ok{background:#e3f6e9;border:1px solid #9ed8b3}
.fb.bad{background:#fdeeee;border:1px solid #f0b3b3}
.fb b.t{display:block;font-size:1.05rem;margin-bottom:2px}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;font-size:1.05rem;font-weight:700;background:var(--green);color:#fff;box-shadow:0 3px 0 #146337}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #146337}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 #cfe3d7}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:#f3faf6;border:1px dashed #9ed8b3;border-radius:14px;padding:12px 8px;font-weight:700;font-size:1rem;margin-top:8px}
.eq .term{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.eq .blank{background:#fff7d6;border:2px dashed var(--amber);border-radius:10px;padding:6px 14px;color:#9a5b00}
.eq .arrow{font-size:.85rem;color:var(--teal);text-align:center;line-height:1.1}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:8px 0 2px;font-weight:650}
.chain .o{background:#f3faf6;border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:.95rem}
.chain .o.hi{background:#fff1d6;border:2px solid var(--amber)}
.chain .ar{color:var(--teal);font-weight:800}
/* match */
.mgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:8px;margin-top:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:.92rem;line-height:1.3;text-align:left;min-height:62px;font-weight:550}
.mi.l{font-weight:750;font-size:1rem}
.mi.sel{border-color:var(--teal);background:#dff3f4}
.mi.done{border-color:var(--green);background:#e3f6e9;opacity:.75}
.mi.bad{border-color:var(--red);background:#fdeaea}
/* build */
.built{min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#f3faf6;border:1px dashed #9ed8b3;border-radius:14px;padding:10px;margin-top:10px}
.built .ph{color:var(--muted);font-size:.95rem}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.tok{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:1rem;font-weight:650;min-height:50px}
.tok.used{visibility:hidden}
.tok.bad{border-color:var(--red);background:#fdeaea}
.svgbox{background:#fbfdfc;border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.hint{font-size:.88rem;color:var(--muted)}
.score{text-align:center}
.score .big{font-size:3rem;font-weight:800;color:var(--green);line-height:1}
.rev{border-left:4px solid var(--red);background:#fffafa;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;line-height:1.4}
.rev .q{font-weight:700}
.rev .a{color:var(--green);font-weight:700}
.sum ul{margin:4px 0 8px;padding-left:20px;line-height:1.5}
.sum li{margin:2px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft)}
.foot{text-align:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
function $(s){return document.querySelector(s);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var app=document.getElementById('app');

/* ====== ORGANISMOS ====== */
var EM={'Pasto':'🌱','Arbustos':'🌿','Saltamontes':'🦗','Degú':'🐭','Conejo':'🐇','Lagartija':'🦎','Culebra de cola larga':'🐍','Zorro culpeo':'🦊','Águila mora':'🦅','Puma':'🐆','Guanaco':'🦙',
'Fitoplancton':'🟢','Zooplancton':'🔹','Krill':'🦐','Anchoveta':'🐟','Sardina':'🐟','Jurel':'🐟','Pingüino de Humboldt':'🐧','Lobo marino':'🦭','Orca':'🐋','Ballena azul':'🐳',
'Trigo':'🌾','Ratón':'🐁','Lechuga':'🥬','Caracol':'🐌','Zorzal':'🐦','Vaca':'🐄','Ser humano':'🧑','Cernícalo':'🦅','Hongos':'🍄','Bacterias':'🦠'};
function on(n){return (EM[n]?EM[n]+' ':'')+n;}
var LEVELS=['Productor','Consumidor primario','Consumidor secundario','Consumidor terciario','Consumidor cuaternario'];
var LV_OPTS=['Productor','Consumidor primario','Consumidor secundario','Consumidor terciario','Descomponedor'];
var CHAINS=[
 ['Pasto','Conejo','Zorro culpeo'],
 ['Pasto','Saltamontes','Lagartija','Cernícalo'],
 ['Fitoplancton','Zooplancton','Anchoveta','Pingüino de Humboldt'],
 ['Fitoplancton','Krill','Sardina','Lobo marino'],
 ['Arbustos','Guanaco','Puma'],
 ['Trigo','Ratón','Culebra de cola larga','Águila mora'],
 ['Lechuga','Caracol','Zorzal'],
 ['Pasto','Vaca','Ser humano'],
 ['Lechuga','Ser humano'],
 ['Fitoplancton','Krill','Ballena azul'],
 ['Fitoplancton','Zooplancton','Jurel','Lobo marino','Orca']
];
function chainHTML(c,hi){return '<div class="chain">'+c.map(function(n,i){return '<span class="o'+(i===hi?' hi':'')+'">'+on(n)+'</span>';}).join('<span class="ar">→</span>')+'</div>';}
function lc(s){return s.charAt(0).toLowerCase()+s.slice(1);}
function art(n){var f={'Culebra de cola larga':1,'Lagartija':1,'Vaca':1,'Sardina':1,'Anchoveta':1,'Orca':1,'Ballena azul':1,'Águila mora':1,'Lechuga':1};return (f[n]?'la ':'el ')+(n==='Ser humano'?'ser humano':(n==='Arbustos'?'arbustos':lc(n.indexOf('Pingüino')===0||n.indexOf('Zorro')===0?n:n)));}
function nm(n){return n==='Ser humano'?'ser humano':(/^(Pingüino de Humboldt|Zorro culpeo|Águila mora)$/.test(n)?n.charAt(0).toLowerCase()+n.slice(1):lc(n));}

/* ====== MODO 1: FOTOSÍNTESIS ====== */
var FOTO=[
 {q:'¿Qué es la fotosíntesis?',a:'El proceso en que las plantas fabrican su propio alimento (glucosa) usando luz, agua y dióxido de carbono',w:['El proceso en que las plantas absorben alimento ya hecho desde el suelo','La forma en que los animales obtienen energía al comer plantas','El proceso en que las plantas eliminan el agua que les sobra'],e:'En la fotosíntesis la planta transforma la energía de la luz en energía química guardada en la glucosa. El alimento NO viene del suelo: del suelo solo toma agua y sales minerales.'},
 {q:'¿En qué organelo de la célula vegetal ocurre la fotosíntesis?',a:'En el cloroplasto',w:['En el núcleo','En la pared celular','En la vacuola'],e:'El cloroplasto contiene clorofila y es donde se realiza la fotosíntesis. Las hojas tienen muchísimos cloroplastos.'},
 {q:'¿Cuál es la función de la clorofila?',a:'Captar (absorber) la energía de la luz solar',w:['Absorber agua desde el suelo','Transportar la glucosa por la planta','Dejar entrar el dióxido de carbono'],e:'La clorofila es el pigmento verde de los cloroplastos que capta la energía luminosa. Por eso las hojas se ven verdes.'},
 {q:'¿Qué gas toma la planta del aire para hacer fotosíntesis?',a:'Dióxido de carbono (CO₂)',w:['Oxígeno (O₂)','Nitrógeno (N₂)','Vapor de agua'],e:'El CO₂ entra a la hoja por los estomas. Es uno de los "ingredientes" de la fotosíntesis.'},
 {q:'¿Qué gas libera la planta al ambiente como producto de la fotosíntesis?',a:'Oxígeno (O₂)',w:['Dióxido de carbono (CO₂)','Hidrógeno','Nitrógeno'],e:'El oxígeno sale por los estomas. Es el oxígeno que respiramos los animales y las personas.'},
 {q:'¿Por dónde entra el dióxido de carbono a la hoja?',a:'Por los estomas',w:['Por la raíz','Por los pelos absorbentes','Por el floema'],e:'Los estomas son pequeños poros (principalmente en la cara inferior de la hoja) que permiten el intercambio de gases: entra CO₂ y salen O₂ y vapor de agua.'},
 {q:'¿Cómo llega el agua desde el suelo hasta las hojas?',a:'La absorbe la raíz y sube por el tallo a través del xilema',w:['Entra por los estomas desde la lluvia','La fabrica la hoja en los cloroplastos','Baja desde las hojas por el floema'],e:'La raíz absorbe agua y sales minerales (savia bruta), que suben por los vasos del xilema del tallo hasta las hojas.'},
 {q:'¿En qué parte de la planta ocurre principalmente la fotosíntesis?',a:'En las hojas',w:['En la raíz','En las flores','En las semillas'],e:'Las hojas son anchas y planas para captar mucha luz y tienen muchos cloroplastos. Los tallos verdes también pueden hacer algo de fotosíntesis.'},
 {q:'¿Qué transformación de energía ocurre en la fotosíntesis?',a:'Energía luminosa (luz) → energía química (glucosa)',w:['Energía química → energía luminosa','Energía eléctrica → energía térmica','Energía química → energía del movimiento'],e:'La planta "guarda" la energía de la luz en la glucosa. Esa energía química luego pasa a los animales que se comen a la planta.'},
 {q:'¿Para qué usa la planta la glucosa que fabrica?',a:'Como fuente de energía para vivir y crecer; lo que sobra lo guarda como almidón',w:['La elimina por los estomas','La devuelve al suelo por la raíz','Solo para darle color verde a las hojas'],e:'La glucosa es el alimento de la planta. Con ella obtiene energía, crece y forma sus estructuras; el exceso se almacena como almidón (en raíces, tallos, semillas o frutos).'},
 {q:'¿Por qué las plantas se llaman "productores" (autótrofos)?',a:'Porque fabrican su propio alimento mediante la fotosíntesis',w:['Porque producen semillas','Porque comen otros seres vivos','Porque descomponen restos de organismos'],e:'Autótrofo = que fabrica su propio alimento. Los animales son heterótrofos: deben comer a otros seres vivos.'},
 {q:'¿Cuál de estos NO es un ingrediente (reactante) de la fotosíntesis?',a:'Oxígeno',w:['Agua','Dióxido de carbono','Luz solar'],e:'El oxígeno es un PRODUCTO (sale de la fotosíntesis), no un ingrediente. Ingredientes: agua, CO₂ y luz (captada por la clorofila).'},
 {q:'Si una planta queda varios días en total oscuridad, ¿qué pasa?',a:'No puede hacer fotosíntesis, no fabrica glucosa y se debilita',w:['Hace más fotosíntesis para compensar','No le pasa nada porque saca el alimento del suelo','Empieza a producir más oxígeno'],e:'Sin luz no hay fotosíntesis. La planta gasta sus reservas y, si sigue sin luz, se debilita y puede morir.'},
 {q:'¿Cuál afirmación es correcta?',a:'Las plantas hacen fotosíntesis y también respiran (usan oxígeno)',w:['Las plantas solo hacen fotosíntesis y nunca respiran','Las plantas respiran solo de noche y hacen fotosíntesis solo de día, nunca a la vez','Solo los animales necesitan oxígeno'],e:'Las plantas respiran todo el día y toda la noche (usan O₂ para sacar energía de la glucosa). La fotosíntesis ocurre solo cuando hay luz.'},
 {q:'¿Por qué la fotosíntesis es importante para los animales?',a:'Produce el oxígeno que respiran y el alimento que da inicio a las cadenas tróficas',w:['Porque elimina el oxígeno del aire','Porque los animales también hacen fotosíntesis','No es importante para los animales'],e:'Casi toda la energía de los ecosistemas entra por la fotosíntesis de los productores. Sin ellos no habría alimento ni oxígeno.'},
 {q:'Además de las plantas, ¿quiénes hacen fotosíntesis?',a:'Las algas y el fitoplancton',w:['Los hongos','El zooplancton','Los animales herbívoros'],e:'Las algas y el fitoplancton (algas microscópicas del mar) tienen clorofila y son los productores de los ecosistemas acuáticos. Los hongos NO hacen fotosíntesis.'},
 {q:'¿Qué absorbe la raíz del suelo?',a:'Agua y sales minerales',w:['Glucosa y almidón','Oxígeno y luz','Dióxido de carbono'],e:'La raíz absorbe agua y sales minerales. La planta no "come" tierra: su alimento (glucosa) lo fabrica en las hojas.'}
];
var EQ=['Agua','Dióxido de carbono','Glucosa','Oxígeno'];
var EQ_DIST=['Sales minerales','Nitrógeno','Almidón','Clorofila','Vapor de agua'];
function eqHTML(blank){
 function t(n){return n===blank?'<span class="blank">?</span>':'<span class="term">'+(n==='Agua'?'💧 ':n==='Dióxido de carbono'?'💨 ':n==='Glucosa'?'🍬 ':'🫧 ')+n+'</span>';}
 var arrow=blank==='Luz'?'<span class="arrow"><span class="blank">?</span><br>───►</span>':'<span class="arrow">☀️ luz solar<br>───►<br><small>clorofila</small></span>';
 return '<div class="eq">'+t('Agua')+'+'+t('Dióxido de carbono')+arrow+t('Glucosa')+'+'+t('Oxígeno')+'</div>';
}
function genFoto(){
 var qs=shuffle(FOTO).slice(0,7).map(function(f){return {prompt:f.q,a:f.a,opts:shuffle([f.a].concat(f.w)),e:f.e};});
 var blanks=shuffle(EQ.concat(['Luz'])).slice(0,3);
 blanks.forEach(function(b){
  var ans=b==='Luz'?'Luz solar':b;
  var wrong=shuffle(EQ.filter(function(x){return x!==b;}).concat(EQ_DIST)).slice(0,3);
  if(b==='Luz'){wrong=['Oxígeno','Sales minerales','Calor del suelo'];}
  var role=(b==='Glucosa'||b==='Oxígeno')?'producto':'ingrediente';
  qs.push({prompt:'Completa la ecuación de la fotosíntesis: ¿qué va en el espacio <b>?</b>',extra:eqHTML(b),a:ans,opts:shuffle([ans].concat(wrong)),
   e:'Ecuación: agua + dióxido de carbono → (luz solar + clorofila) → glucosa + oxígeno. '+(b==='Luz'?'La luz solar es la fuente de energía, captada por la clorofila.':ans+' es un '+role+' de la fotosíntesis.')});
 });
 return shuffle(qs);
}

/* ====== MODO 2: PARTES DE LA PLANTA ====== */
var PARTS=[
 ['🌳 Raíz','Absorbe agua y sales minerales del suelo y fija la planta'],
 ['🪵 Tallo','Sostiene la planta y conduce sustancias entre raíz y hojas'],
 ['🍃 Hoja','Órgano donde ocurre principalmente la fotosíntesis'],
 ['🕳️ Estomas','Poros de la hoja por donde entra CO₂ y salen O₂ y vapor de agua'],
 ['🟩 Cloroplasto','Organelo de la célula vegetal donde se realiza la fotosíntesis'],
 ['💚 Clorofila','Pigmento verde que capta la energía de la luz'],
 ['⬆️ Xilema','Vasos que llevan agua y sales minerales (savia bruta) desde la raíz a las hojas'],
 ['⬇️ Floema','Vasos que llevan la glucosa (savia elaborada) desde las hojas a toda la planta'],
 ['〰️ Nervaduras','"Venas" de la hoja que contienen los vasos conductores'],
 ['🧴 Epidermis / cutícula','Capa externa de la hoja que la protege y evita que pierda agua']
];

/* ====== MODO 3: NIVEL TRÓFICO ====== */
var DESC=[
 {c:'Hongos que crecen sobre un tronco caído y lo van deshaciendo',n:'Hongos'},
 {c:'Bacterias del suelo que descomponen hojas secas y restos de animales',n:'Bacterias'},
 {c:'Hongos (como el moho) que aparecen sobre una fruta podrida',n:'Hongos'}
];
function levelQ(c,i){
 var n=c[i],ans=LEVELS[i],e;
 if(i===0)e=on(n)+' es PRODUCTOR: fabrica su propio alimento con la fotosíntesis. Siempre va al inicio de la cadena.';
 else if(i===1)e=on(n)+' se alimenta de un productor ('+nm(c[0])+'), por eso es CONSUMIDOR PRIMARIO (herbívoro).';
 else e=on(n)+' se come a '+nm(c[i-1])+', que es '+lc(LEVELS[i-1])+'; por eso '+nm(n)+' es '+lc(ans).toUpperCase()+'. Cuenta la posición: productor → 1° → 2° → 3°.';
 if(n==='Ser humano')e+=' Ojo: el mismo organismo puede ocupar distintos niveles según lo que coma en esa cadena.';
 return {prompt:'En esta cadena, ¿qué nivel trófico ocupa <b>'+on(n)+'</b>?',extra:chainHTML(c,i),a:ans,opts:LV_OPTS.slice(),e:e};
}
function genNivel(){
 var qs=[],used={};
 var hum=Math.random()<.5?7:8; qs.push(levelQ(CHAINS[hum],CHAINS[hum].length-1)); used[hum+'-'+(CHAINS[hum].length-1)]=1;
 var guard=0;
 while(qs.length<8&&guard++<200){
  var ci=Math.floor(Math.random()*CHAINS.length),c=CHAINS[ci];
  var i=Math.floor(Math.random()*Math.min(c.length,4));
  if(i===0&&Math.random()<.6)i=Math.min(c.length-1,1+Math.floor(Math.random()*3));
  if(i>3)continue;

  var p1=trim(a,1,1),p2=trim(b,-1,-1);

 var h=topBar()+'<div class="card"><div class="qnum">Cadena '+(S.i+1)+' de '+S.total+'</div><div class="prompt">Arma la cadena trófica: toca los organismos en el orden en que fluye la energía, empezando por el productor.</div>';
 h+='<div class="built" id="built"><span class="ph">☀️ Sol →</span></div><div class="pool">';
 pool.forEach(function(n,k){h+='<button class="tok" data-n="'+esc(n)+'">'+on(n)+'</button>';});
 h+='</div><div class="hint" style="margin-top:8px">La flecha → se lee "es comido por".</div><div id="fb"></div></div>';
 app.innerHTML=h;bindHome();window.scrollTo(0,0);
 var pos=0,err=false,first=null;
 app.querySelectorAll('.tok').forEach(function(b){b.onclick=function(){
  if(pos>=c.length||b.classList.contains('used'))return;
  var n=b.getAttribute('data-n');
  if(n===c[pos]){
   b.classList.add('used');
   $('#built').insertAdjacentHTML('beforeend',(pos>0?'<span class="ar" style="color:#0e7c86;font-weight:800">→</span>':'')+'<span class="o" style="background:#fff;border:1px solid #d6e6dc;border-radius:10px;padding:5px 8px;font-weight:650">'+on(n)+'<br><small style="color:#5b716b;font-weight:500">'+LEVELS[pos].replace('Consumidor','Cons.')+'</small></span>');
   pos++;
   if(pos===c.length){
    award(!err);
    var ex='Productor ('+nm(c[0])+') → consumidor primario ('+nm(c[1])+')'+(c[2]?' → secundario ('+nm(c[2])+')':'')+(c[3]?' → terciario ('+nm(c[3])+')':'')+(c[4]?' → cuaternario ('+nm(c[4])+')':'')+'. La energía del Sol entra por el productor y pasa de un eslabón al siguiente.';
    if(err)S.miss.push({q:'Ordenar la cadena: '+shuffle(c).join(', '),a:c.join(' → '),your:first,e:ex});
    $('#fb').innerHTML=fbHTML(!err,ex,c.join(' → '))+'<div style="margin-top:10px"><button class="btn full" id="next">'+(S.i+1<S.total?'Siguiente →':'Ver resultado')+'</button></div>';
    app.querySelector('.chip').textContent='⭐ '+S.pts;app.querySelector('.chip.fire').textContent='🔥 '+S.streak;
    $('#next').onclick=function(){S.i++;if(S.i<S.total)showBuild();else finish();};
   }
  } else {
   if(!err){err=true;first='Pusiste '+nm(n)+' en la posición '+(pos+1);}
   b.classList.add('bad','shake');setTimeout(function(){b.classList.remove('bad','shake');},450);
   var tip=pos===0?'Empieza por el PRODUCTOR: el organismo que hace fotosíntesis.':'¿Quién se come a '+nm(c[pos-1])+'?';
   var fb=$('#fb');fb.innerHTML='<div class="fb bad"><b class="t">Todavía no.</b>'+tip+'</div>';
  }
 };});
}
/* --- FIN --- */
function finish(){
 var m=MODES[S.mode];saveBest(m.id,S.pts);
 var pct=S.ok/S.total,msg=pct===1?'¡Perfecto! Estás lista para el test. 🌟':pct>=.8?'¡Muy bien! Repasa los detalles de abajo.':pct>=.6?'Bien, pero vale la pena repasar y jugar otra ronda.':'Repasa el resumen y vuelve a intentarlo. ¡Tú puedes!';
 var h='<div class="card score"><div class="qnum">'+m.ic+' '+m.t+' · Resultado</div><div class="big">'+S.pts+'</div><div>puntos</div><p><b>'+S.ok+' de '+S.total+'</b> correctas · mejor racha 🔥 '+S.maxStreak+'</p><p>'+msg+'</p><div class="row"><button class="btn" id="again">Otra ronda</button><button class="btn sec" id="menu">Menú</button></div></div>';
 if(S.miss.length){h+='<div class="card"><h2>📌 Para repasar</h2>';S.miss.forEach(function(x){h+='<div class="rev"><div class="q">'+x.q+'</div><div>Tu respuesta: '+esc(x.your||'—')+'</div><div class="a">✔ '+esc(x.a)+'</div><div>'+x.e+'</div></div>';});h+='</div>';}
 else h+='<div class="card center"><p>Sin errores en esta ronda. 💚</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 $('#again').onclick=function(){start(S.mode);};$('#menu').onclick=menu;
}
/* --- RESUMEN --- */
function resumen(){
 var h='<div class="top"><button class="ib" id="home2">⌂</button><div class="mid">📘 Resumen para repasar</div></div><div class="card sum">';
 h+='<h3>☀️ Fotosíntesis</h3><p>Proceso en que los <b>productores</b> (plantas, algas, fitoplancton) fabrican su propio alimento. Ocurre en los <b>cloroplastos</b>, principalmente de las <b>hojas</b>.</p>'+eqHTML('')+'<ul><li><b>Ingredientes:</b> agua (entra por la raíz), dióxido de carbono (entra por los estomas), luz solar (la capta la clorofila).</li><li><b>Productos:</b> glucosa (alimento/energía de la planta; el exceso se guarda como almidón) y oxígeno (sale por los estomas).</li><li>Transforma <b>energía luminosa → energía química</b>.</li><li>Las plantas también <b>respiran</b> (día y noche).</li></ul>';
 h+='<h3>🍃 Estructuras</h3><table class="tbl"><tr><th>Estructura</th><th>Función</th></tr>'+PARTS.map(function(p){return '<tr><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td></tr>';}).join('')+'</table>';
 h+='<h3>🔺 Niveles tróficos</h3><ul><li><b>Productores:</b> hacen fotosíntesis (pasto, arbustos, fitoplancton).</li><li><b>Consumidor primario:</b> herbívoro, come productores (conejo, degú, krill).</li><li><b>Consumidor secundario:</b> come consumidores primarios (zorro culpeo, sardina).</li><li><b>Consumidor terciario:</b> come consumidores secundarios (lobo marino, águila).</li><li><b>Descomponedores:</b> hongos y bacterias; descomponen restos y devuelven nutrientes al suelo.</li><li>El nivel depende de <b>lo que come en esa cadena</b>, no del tamaño (la ballena azul es consumidor secundario).</li></ul>';
 h+='<h3>🔗 Cadenas y tramas</h3>'+chainHTML(['Pasto','Conejo','Zorro culpeo'],-1)+chainHTML(['Fitoplancton','Zooplancton','Anchoveta','Pingüino de Humboldt'],-1)+'<ul><li>La <b>flecha</b> apunta hacia quien come: indica hacia dónde va la <b>energía</b> ("es comido por").</li><li><b>Cadena:</b> una sola secuencia lineal. <b>Trama:</b> varias cadenas conectadas.</li><li>Siempre empiezan con un <b>productor</b>. La energía entra con la luz del Sol.</li><li>La <b>energía fluye</b> en una dirección; la <b>materia se recicla</b> gracias a los descomponedores.</li><li><b>Contar cadenas:</b> parte en cada productor y sigue cada camino hasta el final.</li></ul>';
 h+='<h3>⚖️ Si una especie cambia…</h3><ul><li>Si <b>desaparece un depredador</b> → sus presas aumentan (y luego comen más de lo que ellas comen).</li><li>Si <b>desaparece una presa</b> → sus depredadores tienen menos alimento, disminuyen o comen más de otras presas.</li><li>Si <b>desaparecen los productores</b> → se afecta toda la trama.</li></ul>';
 h+='<button class="btn full" id="back" style="margin-top:8px">Volver al menú</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);$('#home2').onclick=menu;$('#back').onclick=menu;
}
window.__lab={start:start,S:function(){return S;},menu:menu,resumen:resumen};
menu();
})();
</script>
