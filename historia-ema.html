<style>

body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);

p{margin:6px 0;line-height:1.45}

.mbtn small{display:block;color:var(--muted);font-size:.87rem;margin-top:2px}

.c1{background:#fde9e4}.c2{background:#e6eefb}.c3{background:#fdf2d9}.c4{background:#efe8fb}.c5{background:#e1f2f1}.c6{background:#fde6ea}.c7{background:#eceff3}.c0{background:#fff6d6}

.prog{height:8px;background:#e1e6ef;border-radius:8px;overflow:hidden}

.qnum{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.src{background:#fbf8f1;border:1px solid #e7dcc3;border-left:5px solid #b08d4a;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.95rem;line-height:1.45}
.src .who{display:block;font-size:.78rem;font-weight:800;color:#7a5d24;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.opts.three{flex-direction:row}

.opts.three .opt:nth-child(1){background:var(--der)}.opts.three .opt:nth-child(2){background:var(--cen)}.opts.three .opt:nth-child(3){background:var(--izq)}

.opts.three .opt.bad{border-color:#7a1020;box-shadow:0 0 0 3px #f0b3b3}
.opts.grid4{display:grid;grid-template-columns:1fr 1fr}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1rem;line-height:1.3;min-height:52px;font-weight:550}

.opt.ok{border-color:var(--green);background:#e3f6e9}
.opt.bad{border-color:var(--red);background:#fdeaea}

.fb.bad{background:#fdeeee;border:1px solid #f0b3b3}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;font-size:1.05rem;font-weight:700;background:var(--navy);color:#fff;box-shadow:0 3px 0 #0e1d33}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0e1d33}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 #ccd5e5}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}

.seq .ph{color:var(--muted);font-size:.93rem;text-align:center;padding:10px}
.ev{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;font-weight:600;line-height:1.3;min-height:50px;width:100%}
.ev .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800}
.ev .d{flex:0 0 auto;font-weight:800;color:var(--red);font-size:.88rem}
.ev.ok{border-color:var(--green);background:#e3f6e9}
.ev.bad{border-color:var(--red);background:#fdeaea}
.pool{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.score{text-align:center}
.score .big{font-size:3rem;font-weight:800;color:var(--navy);line-height:1}
.rev{border-left:4px solid var(--red);background:#fffafa;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;line-height:1.4}
.rev .q{font-weight:700}
.rev .a{color:var(--green);font-weight:700}
.rev .y{color:var(--red)}
.sum ul{margin:4px 0 8px;padding-left:20px;line-height:1.5}
.sum li{margin:2px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}

.vt{font-size:.66rem}
.vt td,.vt th{text-align:center;padding:4px 1px}
.src .scroll{margin:0 -6px}
.vt td:first-child,.vt th:first-child{text-align:left;font-weight:700}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cols{display:grid;grid-template-columns:1fr;gap:8px}
.col{border-radius:14px;padding:10px 12px;font-size:.93rem;line-height:1.4}
.col h4{margin:0 0 4px;font-size:1.02rem}
.col.d{background:#fbe7e2;border-left:6px solid var(--der)}.col.c{background:#fbf1d6;border-left:6px solid var(--cen)}.col.i{background:#e3ecf8;border-left:6px solid var(--izq)}
.tl{list-style:none;padding:0;margin:6px 0;border-left:3px solid var(--blue)}
.tl li{position:relative;padding:4px 0 6px 14px;line-height:1.35;font-size:.95rem}
.tl li:before{content:"";position:absolute;left:-7px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--red)}
.tl b{color:var(--navy)}
.pr{background:#f6f8fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.pr .ans{margin-top:8px;background:#e3f6e9;border-radius:10px;padding:8px 10px;font-size:.94rem;line-height:1.45}
.badge{display:inline-block;background:#fff1d6;color:#8a5200;border-radius:8px;padding:2px 8px;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:.88rem;color:var(--muted)}
.foot{text-align:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
@media (min-width:560px){.cols{grid-template-columns:1fr 1fr 1fr}.vt{font-size:.9rem}}
</style>

function $(s){return document.querySelector(s);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var app=document.getElementById("app");
var MODES=[
{id:"dci",ic:"⚖️",c:"c1",t:"Derecha, centro o izquierda",d:"Clasifica partidos, ideas y gobiernos",gen:genDCI},
{id:"tl",ic:"🗓️",c:"c2",t:"Línea de tiempo",d:"Ordena los hechos de 1922 a 1990",gen:genTL},
{id:"gov",ic:"🏛️",c:"c3",t:"¿Qué gobierno fue?",d:"Alessandri, Frei, Allende o Junta Militar",gen:genGOV},
{id:"src",ic:"📜",c:"c4",t:"Lee la fuente",d:"Tabla de votaciones, prensa, Allende y Pinochet",gen:genSRC},
{id:"con",ic:"🔑",c:"c5",t:"Conceptos clave",d:"Polarización, golpe de Estado, expropiación…",gen:genCON},

{id:"bon",ic:"⭐",c:"c7",t:"Bonus: la dictadura (1973–1990)",d:"DD.HH., modelo económico, 1980, 1988, 1990",gen:genBON}
];
function mc(q,a,o,x,extra){var r={t:"mc",q:q,a:a,o:o,x:x};for(var k in extra)r[k]=extra[k];return r;}
function qDCI(r){return mc("¿Derecha, centro o izquierda?",r[1],DCI,r[2],{item:r[0],fixed:"three"});}
function qGOV(r){return mc("¿A qué gobierno corresponde?",r[1],GOV,r[2],{item:r[0],fixed:"grid4"});}
function qSRC(s){return mc(s.q,s.a,[s.a].concat(s.o),s.x,{src:s.src});}
function qCON(r,mode){
 var others=shuffle(CO.filter(function(c){return c[0]!==r[0];})).slice(0,3);
 if(mode===0)return mc("¿Qué concepto corresponde a esta definición?",r[0],[r[0]].concat(others.map(function(c){return c[0];})),"<b>"+r[0]+":</b> "+r[1],{item:r[1]});
 return mc("¿Qué significa «"+r[0]+"»?",r[1],[r[1]].concat(others.map(function(c){return c[1];})),"<b>"+r[0]+":</b> "+r[1]);
}
function qTL(n){var ev=shuffle(EV).slice(0,n);return {t:"order",q:"Ordena del más antiguo al más reciente",ev:ev};}
function genDCI(){return shuffle(CL).slice(0,10).map(qDCI);}
function genGOV(){return shuffle(GV).slice(0,10).map(qGOV);}
function genSRC(){return shuffle(SRC).slice(0,10).map(qSRC);}
function genCON(){return shuffle(CO).slice(0,10).map(function(r,i){return qCON(r,i%2);});}
function genTL(){var a=[];for(var i=0;i<8;i++)a.push(qTL(i<4?4:5));return a;}
function genBON(){return shuffle(BO).map(function(s){return mc(s.q,s.a,[s.a].concat(s.o),s.x);});}
function genMIX(){
 var a=[].concat(shuffle(CL).slice(0,2).map(qDCI),shuffle(GV).slice(0,3).map(qGOV),shuffle(SRC).slice(0,3).map(qSRC),shuffle(CO).slice(0,2).map(function(r,i){return qCON(r,i);}));
 a=shuffle(a);a.splice(4,0,qTL(4));a.push(qTL(5));return a;
}

function menu(){

 var h='<div class="hero"><span class="deco">🏛️</span><div class="tag">Historia 6° · Lección 11 · págs. 223–239</div><h1>Archivo 1973</h1><p>Chile en la segunda mitad del siglo XX: de la polarización al golpe de Estado. Elige un modo y gana puntos; las rachas suman bonus 🔥.</p></div>';
 h+='<button class="mbtn" id="resBtn"><span class="ic c0">📚</span><span class="tx"><b>Resumen para repasar</b><small>Tabla de los 3 sectores, línea de tiempo, conceptos y preguntas de desarrollo</small></span></button>';

function topBar(){
 return '<div class="top"><button class="ib" id="home" aria-label="Menú">🏠</button><div class="mid">'+S.m.ic+' '+S.m.t+'</div><span class="chip">⭐ '+S.pts+'</span><span class="chip fire">🔥 '+S.streak+'</span></div><div class="prog"><i style="width:'+Math.round(100*S.i/S.total)+'%"></i></div>';
}
function bindHome(){$("#home").onclick=function(){if(S&&S.i>0&&!confirm("¿Salir de la ronda? Se perderá el avance."))return;menu();};}
function award(ok,q,yours,correct){
 if(ok){S.streak++;S.ok++;if(S.streak>S.best)S.best=S.streak;var bonus=S.streak>=2?Math.min(50,(S.streak-1)*10):0;S.pts+=100+bonus;return bonus;}
 S.streak=0;S.wrong.push({q:q,y:yours,a:correct,x:q.x});return 0;
}
function fbHTML(ok,bonus,q,extra){
 return '<div class="fb '+(ok?"ok":"bad")+'"><b class="t">'+(ok?"✅ ¡Correcto! +100"+(bonus?" (+"+bonus+" racha 🔥)":""):"❌ No era esa.")+"</b>"+(extra||"")+(q.x?q.x:"")+'</div><button class="btn full" id="next" style="margin-top:10px">'+(S.i+1<S.total?"Siguiente ➜":"Ver resultado 🏁")+"</button>";
}
function show(){
 if(S.i>=S.total)return finish();
 var q=S.qs[S.i];
 if(q.t==="order")return showOrder(q);
 var opts=q.fixed?q.o.slice():shuffle(q.o);
 var h=topBar()+'<div class="card"><div class="qnum">Pregunta '+(S.i+1)+" de "+S.total+'</div><div class="prompt">'+q.q+"</div>"+(q.src||"")+(q.item?'<div class="item">'+q.item+"</div>":"")+'<div class="opts '+(q.fixed||"")+'">';
 opts.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+"</button>";});
 h+='</div><div id="fbx"></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);bindHome();
 var bs=app.querySelectorAll(".opt");
 [].forEach.call(bs,function(b){b.onclick=function(){
  var ch=opts[+b.getAttribute("data-k")],ok=ch===q.a;
  [].forEach.call(bs,function(x){x.disabled=true;var v=opts[+x.getAttribute("data-k")];if(v===q.a)x.classList.add("ok");else if(x===b)x.classList.add("bad");else x.classList.add("dim");});
  if(!ok)b.classList.add("shake");
  var bonus=award(ok,q,ch,q.a);
  $("#fbx").innerHTML=fbHTML(ok,bonus,q,ok?"":"La respuesta correcta es: <b>"+esc(q.a)+"</b>. ");
  upd();$("#next").onclick=function(){S.i++;show();};
  $("#next").scrollIntoView({behavior:"smooth",block:"nearest"});
 };});
}
function upd(){var c=app.querySelectorAll(".chip");c[0].textContent="⭐ "+S.pts;c[1].textContent="🔥 "+S.streak;app.querySelector(".prog i").style.width=Math.round(100*(S.i+1)/S.total)+"%";}
function evBtn(e,n,cls){return '<button class="ev '+(cls||"")+'" data-id="'+e[0]+'">'+(n?'<span class="n">'+n+"</span>":"")+(cls?'<span class="d">'+e[1]+"</span>":"")+"<span>"+e[2]+"</span></button>";}
function showOrder(q){
 var pool=q.ev.slice(),seq=[],done=false;
 function render(){
  var h=topBar()+'<div class="card"><div class="qnum">Pregunta '+(S.i+1)+" de "+S.total+' · Línea de tiempo</div><div class="prompt">'+q.q+'</div><p class="hint">Toca los hechos en orden (1 = el más antiguo). Toca uno de tu lista para quitarlo.</p><div class="seq" id="seq">';
  if(!seq.length)h+='<div class="ph">Tu línea de tiempo aparecerá aquí</div>';
  seq.forEach(function(e,k){h+=evBtn(e,k+1);});
  h+='</div><div class="pool" id="pool">';pool.forEach(function(e){h+=evBtn(e,0);});
  h+='</div><button class="btn full" id="chk" style="margin-top:12px"'+(pool.length?" disabled":"")+'>Comprobar ✔</button><div id="fbx"></div></div>';
  app.innerHTML=h;bindHome();
  [].forEach.call(app.querySelectorAll("#pool .ev"),function(b){b.onclick=function(){var id=+b.getAttribute("data-id");var k=pool.findIndex(function(e){return e[0]===id;});seq.push(pool.splice(k,1)[0]);render();};});
  [].forEach.call(app.querySelectorAll("#seq .ev"),function(b){b.onclick=function(){var id=+b.getAttribute("data-id");var k=seq.findIndex(function(e){return e[0]===id;});pool.push(seq.splice(k,1)[0]);render();};});
  $("#chk").onclick=check;
 }
 function check(){
  if(pool.length||done)return;done=true;
  var right=q.ev.slice().sort(function(a,b){return a[0]-b[0];});
  var ok=seq.every(function(e,k){return e[0]===right[k][0];});
  var bonus=award(ok,{q:"Ordenar: "+right.map(function(e){return e[2];}).join(" / "),x:""},seq.map(function(e){return e[1];}).join(" → "),right.map(function(e){return e[1]+" "+e[2];}).join(" → "));
  if(!ok)S.wrong[S.wrong.length-1].x="Orden correcto: "+right.map(function(e){return "<b>"+e[1]+"</b> "+e[2];}).join(" → ");
  var h="";seq.forEach(function(e,k){h+=evBtn(e,k+1,e[0]===right[k][0]?"ok":"bad");});
  $("#seq").innerHTML=h;$("#pool").remove();$("#chk").remove();
  var extra=ok?"Todas las fechas en su lugar.":"Orden correcto:<br>"+right.map(function(e,k){return (k+1)+". <b>"+e[1]+"</b> – "+e[2];}).join("<br>");
  $("#fbx").innerHTML=fbHTML(ok,bonus,{x:""},extra);
  upd();$("#next").onclick=function(){S.i++;show();};
  $("#next").scrollIntoView({behavior:"smooth",block:"nearest"});
 }
 render();window.scrollTo(0,0);
}

function resumen(){
 S=null;
 var h='<div class="top"><button class="ib" id="home2" aria-label="Menú">🏠</button><div class="mid">📚 Resumen para repasar</div></div><div class="card sum">';
 h+='<h2>1. Chile entre 1960 y 1970</h2><p>A principios del siglo XX los partidos principales (Liberal, Conservador y Radical) representaban a la <b>oligarquía</b>. En la primera mitad del siglo surgieron <b>nuevos partidos</b> para sectores medios y populares, y las fuerzas políticas se ordenaron en <b>tres grandes tendencias: izquierda, centro y derecha</b>.</p><p>En los años 70 hubo alta confrontación y creciente <b>polarización</b>: la población se dividió en posiciones de extremos opuestos y se debilitaron el diálogo y los puntos de encuentro.</p>';
 h+='<h3>Principales sectores y proyectos (1930–1970)</h3><div class="cols">';
 h+='<div class="col d"><h4>Derecha</h4><b>Partidos:</b> Liberal (1841), Conservador (1857), Nacional (fusión de ambos; el libro indica 1964).<br><b>Ideas:</b> mantener el orden político y las jerarquías sociales; reticentes a reformas profundas y a ampliar el rol del Estado.<br><b>Apoyo:</b> oligarquía y algunos sectores medios y populares.<br><b>Gobierno:</b> Jorge Alessandri (1958–1964).</div>';
 h+='<div class="col c"><h4>Centro</h4><b>Partidos:</b> Radical (1863), Falange Nacional (1938), Demócrata Cristiano (1957).<br><b>Ideas:</b> cambios moderados para beneficiar a grupos medios y populares; convivían visiones socialcristianas y laicas.<br><b>Apoyo:</b> clase media, parte de sectores populares y de la oligarquía.<br><b>Gobierno:</b> Eduardo Frei Montalva (1964–1970).</div>';
 h+='<div class="col i"><h4>Izquierda</h4><b>Partidos:</b> Comunista (1922), Socialista (1933).<br><b>Ideas:</b> mejores condiciones para los trabajadores, distribución más equitativa de la riqueza, grandes reformas sociales y fortalecer el rol del Estado.<br><b>Apoyo:</b> sectores populares y parte de los grupos medios.<br><b>Gobierno:</b> Salvador Allende (1970–1973).</div></div>';
 h+='<h3>Los tres gobiernos</h3><ul><li><b>Jorge Alessandri (1958–1964):</b> derecha; había sido ministro de Hacienda.</li><li><b>Eduardo Frei Montalva (1964–1970):</b> «Revolución en Libertad»: Reforma Agraria, sindicalización campesina, chilenización del cobre, promoción popular.</li><li><b>Salvador Allende (1970–1973):</b> Unidad Popular: nacionalización del cobre (1971), profundizó la Reforma Agraria, expropiaciones de industrias, empresas y fundos.</li></ul>';
 h+='<h3>Tendencia electoral (Fuente A, Gamboa)</h3>'+voteTable()+'<p>Crecieron la <b>DC</b>, los <b>socialistas</b> y los <b>comunistas</b>; disminuyeron <b>conservadores</b> y <b>liberales</b> (se fusionaron en el Partido Nacional) y <b>radicales</b>.</p>';
 h+='<h2 style="margin-top:16px">2. El contexto previo al golpe</h2><ul><li>Frei y Allende hicieron transformaciones a favor de sectores populares y medios: tuvieron popularidad, pero también reacciones contrapuestas.</li><li>Con Allende: conflictos con la oposición (derecha y centro) y <b>crisis económica 1972–1973</b> (desabastecimiento, filas, protestas).</li><li><b>Nacionalización del cobre (1971)</b>: apoyada ampliamente por el Congreso y la ciudadanía. <b>Expropiaciones</b> a sectores estratégicos para distribuir la riqueza y fortalecer el control estatal.</li><li><b>La prensa</b> se polarizó: información parcial, insultos, y difundió soluciones fuera de la Constitución.</li><li><b>Marzo 1973:</b> elección parlamentaria sin mayoría; la UP sacó más del 40%, la oposición no tuvo votos para destituir al presidente.</li><li><b>Junio 1973:</b> «tanquetazo», intento de golpe (22 muertos).</li><li>Algunos sectores promovieron la intervención de las FF.AA. → <b>quiebre de la democracia</b>.</li></ul>';
 h+='<h2 style="margin-top:16px">3. El golpe de Estado (11 sep 1973)</h2><p>Las FF.AA. derrocaron al gobierno de Salvador Allende (bombardeo a La Moneda). Asumió una <b>Junta Militar</b> (generales de las FF.AA. y Carabineros) con <b>Augusto Pinochet</b> al mando. Se impuso una <b>dictadura</b> que duró <b>casi 17 años</b>, con apoyo de sectores civiles.</p><p><b>Medidas:</b></p><ul><li>Suspensión de derechos y libertades civiles.</li><li>Clausura del Congreso (DL 27, 21 sep 1973).</li><li>Supresión de elecciones y registros electorales.</li><li>Prohibición de partidos de izquierda y receso de los otros.</li><li>Estado de sitio y fuerte represión: violaciones a los DD.HH., perseguidos, muertos y desaparecidos.</li><li>DL 527 (1974): la Junta asume los poderes Constituyente, Legislativo y Ejecutivo → fin de la <b>separación de poderes</b>.</li></ul>';
 h+='<h3>Dos perspectivas (fuentes)</h3><ul><li><b>Allende</b> (Radio Magallanes): «La historia es nuestra y la hacen los pueblos»; denuncia el golpe y acusa al capital extranjero unido a «la reacción».</li><li><b>Pinochet</b> (Memorias, 1990): dice que Allende quería imponer de forma «irreversible» el marxismo-leninismo y que las FF.AA. ejercieron un «legítimo derecho de rebelión».</li></ul><p class="hint">Son visiones opuestas de protagonistas: siempre pregúntate quién escribe la fuente y desde qué punto de vista.</p>';
