<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<title>Científica en Acción · Variables, tablas, gráficos y promedio</title>
<style>
:root{--ink:#14263d;--muted:#5a6b80;--card:#fff;--blue:#1d4e89;--teal:#0e7c86;--green:#1f8a4c;--amber:#f0a202;--red:#d64545;--line:#d8e2ee;--soft:#eaf1f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#dde8f5 0,#eef3f9 220px,#f6f9fc 100%);min-height:100vh;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
h1{font-size:1.65rem;margin:0;line-height:1.15}
h2{font-size:1.2rem;margin:0 0 6px}
h3{font-size:1.03rem;margin:14px 0 4px;color:var(--blue)}
p{margin:6px 0;line-height:1.45}
.hero{background:linear-gradient(135deg,#1d4e89,#0e7c86 65%,#1f8a4c);color:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(29,78,137,.25);position:relative;overflow:hidden}
.hero .tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:700}
.hero .deco{position:absolute;right:-6px;top:-8px;font-size:5.3rem;opacity:.18;transform:rotate(15deg)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(20,40,70,.08);border:1px solid var(--line)}
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:72px;box-shadow:0 3px 0 #cddbea}
.mbtn:active{transform:translateY(2px)}
.mbtn .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:0 0 auto;background:var(--soft)}
.mbtn b{display:block;font-size:1.05rem}.mbtn small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.mbtn .best{font-size:.78rem;color:var(--green);font-weight:700;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.bar{height:8px;background:#dbe5f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .3s}
.q{font-size:1.07rem;font-weight:600;line-height:1.4}
.ctx{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.95rem;line-height:1.45;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.98rem;line-height:1.35}
.opt.ok{border-color:var(--green);background:#e5f6ec}.opt.bad{border-color:var(--red);background:#fdeaea}
.opt:disabled{cursor:default}
.big{display:block;width:100%;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;margin-top:12px}
.big.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.fb{margin-top:10px;border-radius:12px;padding:10px 12px;line-height:1.45;font-size:.95rem}
.fb.ok{background:#e5f6ec;border-left:5px solid var(--green)}.fb.bad{background:#fdeaea;border-left:5px solid var(--red)}
input.num{font-size:1.15rem;padding:10px;border:2px solid var(--line);border-radius:12px;width:130px;text-align:center;font-family:inherit}
input.num.ok{border-color:var(--green);background:#e5f6ec}input.num.bad{border-color:var(--red);background:#fdeaea}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
th,td{border:1px solid #b9c8da;padding:6px 4px;text-align:center}th{background:#e3ecf6;font-size:.82rem}
td input.num{width:72px;font-size:1rem;padding:6px}
.anom{background:#fff3cd;font-weight:700}
svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px}
.sum h3:first-child{margin-top:0}.sum li{margin:4px 0;line-height:1.4}
.small{font-size:.85rem;color:var(--muted)}
.mist{border-left:4px solid var(--red);padding:6px 10px;margin:8px 0;background:#fff8f8;border-radius:8px;font-size:.92rem}
.score{font-size:2.6rem;font-weight:800;text-align:center;color:var(--blue)}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const app=$("#app");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=x=>String(Math.round(x*10)/10).replace(".",",");
const r1=x=>Math.round(x*10)/10;
function parseNum(s){s=String(s).trim().replace(/\s/g,"").replace(",",".");if(!/^-?\d+(\.\d+)?$/.test(s))return NaN;return parseFloat(s)}
const near=(v,t)=>!isNaN(v)&&Math.abs(v-t)<=0.051;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- Experimentos base ---------- */
const EXPS=[
 {d:"Ema pone ramitas de Elodea (planta acuática) a distintas distancias de una lámpara y cuenta cuántas burbujas de oxígeno salen en 1 minuto.",vi:"La distancia a la lámpara (cantidad de luz)",vd:"El número de burbujas de oxígeno por minuto",vc:"El tipo y tamaño de la planta, la temperatura del agua y el tiempo de conteo"},
 {d:"Se riegan plantas de poroto con tres tipos de fertilizante distintos (A, B y C) y después de 3 semanas se mide su altura en cm.",vi:"El tipo de fertilizante",vd:"La altura de la planta (cm)",vc:"La cantidad de agua, la luz, el tipo de semilla y el tamaño del macetero"},
 {d:"Se guardan plátanos verdes a 5 °C, 15 °C y 25 °C y se registra cuántos días tardan en madurar.",vi:"La temperatura de almacenamiento",vd:"El tiempo de maduración (días)",vc:"El tipo y tamaño de plátano y su estado inicial (todos verdes)"},
 {d:"Se riegan plantas de tomate con 100, 200 y 300 mL de agua al día y al final se cuenta el número de frutos de cada planta.",vi:"La cantidad de agua de riego (mL)",vd:"El número de frutos por planta",vc:"La variedad de tomate, la luz, el tipo de tierra y la temperatura"},
 {d:"Se cubren hojas de una planta con papel de distinto color (rojo, verde, azul) y se mide cuánto almidón producen.",vi:"El color de la luz que recibe la hoja",vd:"La cantidad de almidón producido",vc:"El tipo de planta, el tiempo de exposición y la intensidad de la luz"},
 {d:"Se ponen a germinar semillas de lenteja a distintas temperaturas y se cuenta cuántas germinan en 5 días.",vi:"La temperatura",vd:"El número de semillas germinadas",vc:"La cantidad de semillas, el agua y el tipo de algodón/recipiente"},
 {d:"Se colocan manzanas cortadas en recipientes con jugo de limón, agua o nada, y se mide el tiempo (minutos) en que se ponen cafés.",vi:"El tipo de líquido aplicado a la manzana",vd:"El tiempo hasta que se pone café (min)",vc:"La variedad de manzana, el tamaño de los trozos y la temperatura"},
 {d:"Se ponen plantas en horas de luz diaria distintas (4, 8 y 12 horas) y se mide la masa de los frutos de frutilla que producen (g).",vi:"Las horas de luz diaria",vd:"La masa de los frutos (g)",vc:"La variedad de frutilla, el agua, la tierra y la temperatura"}
];
const VCWRONG=["El color del delantal de quien hace el experimento","El día de la semana en que se escribe el informe","El nombre del científico","La marca del lápiz con que se anota"];

/* ---------- SVG gráficos ---------- */
function chart(o){ // o:{type:'bar'|'line', labels, values, title, xl, yl, ymax, step, noUnits, swap}
 const W=360,H=250,L=48,R=12,T=30,B=52,pw=W-L-R,ph=H-T-B;const ym=o.ymax,st=o.step;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Arial" role="img">`;
 if(o.title)s+=`<text x="${W/2}" y="17" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14263d">${esc(o.title)}</text>`;
 for(let v=0;v<=ym;v+=st){const y=T+ph-v/ym*ph;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3e9f1"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#5a6b80">${v}</text>`}
 s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="#14263d" stroke-width="1.5"/><line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="#14263d" stroke-width="1.5"/>`;
 const n=o.labels.length,gw=pw/n;const pts=[];
 o.labels.forEach((lb,i)=>{const cx=L+gw*(i+.5),v=o.values[i],y=T+ph-v/ym*ph;
  if(o.type==="bar")s+=`<rect x="${cx-gw*.3}" y="${y}" width="${gw*.6}" height="${T+ph-y}" rx="3" fill="${["#1d4e89","#0e7c86","#1f8a4c","#f0a202","#8e5bb5"][i%5]}"/>`;
  pts.push([cx,y]);s+=`<text x="${cx}" y="${T+ph+14}" text-anchor="middle" font-size="10.5" fill="#14263d">${esc(lb)}</text>`});
 if(o.type==="line"){s+=`<polyline fill="none" stroke="#1d4e89" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#f0a202" stroke="#1d4e89"/>`)}
 s+=`<text x="${L+pw/2}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="600" fill="#14263d">${esc(o.xl)}</text>`;
 s+=`<text transform="translate(13 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="#14263d">${esc(o.yl)}</text>`;
 return s+"</svg>";
}

/* ---------- Generadores ---------- */
function mc(prompt,correct,wrongs,expl,extra){const options=shuffle([correct,...shuffle(wrongs).slice(0,3)]);return Object.assign({kind:"mc",prompt,options,answer:correct,expl},extra||{})}

function genVariable(){
 const e=rnd(EXPS);const t=rnd(["vi","vd","vc"]);
 const others=EXPS.filter(x=>x!==e);
 if(t==="vi")return mc("¿Cuál es la <b>variable independiente</b> (la que se cambia a propósito)?",e.vi,[e.vd,e.vc,rnd(others).vi],`La independiente es la que el investigador <b>cambia</b>: ${e.vi.toLowerCase()}. La dependiente es la que se <b>mide</b>: ${e.vd.toLowerCase()}.`,{ctx:e.d});
 if(t==="vd")return mc("¿Cuál es la <b>variable dependiente</b> (la que se mide)?",e.vd,[e.vi,e.vc,rnd(others).vd],`La dependiente es el resultado que se <b>mide</b>: ${e.vd.toLowerCase()}. "Depende" de lo que cambiamos (${e.vi.toLowerCase()}).`,{ctx:e.d});
 return mc("¿Cuáles son <b>variables controladas</b> (se mantienen iguales)?",e.vc,[e.vi,e.vd,rnd(VCWRONG)],`Las controladas se mantienen <b>constantes</b> para que la prueba sea justa: ${e.vc.toLowerCase()}.`,{ctx:e.d});
}
const CONCEPT=[
 ()=>mc("¿Qué es la variable independiente?","La que el investigador cambia a propósito",["La que se mide como resultado","La que se mantiene siempre igual","El dato que salió raro"],"Independiente = la que <b>yo cambio</b>. Va en el eje X y en la columna izquierda de la tabla."),
 ()=>mc("¿Por qué se mantienen constantes las variables controladas?","Para que la prueba sea justa y el cambio en el resultado se deba solo a la variable independiente",["Para que el experimento sea más rápido","Para tener más datos en la tabla","Porque no se pueden medir"],"Si cambio dos cosas a la vez, no sé cuál causó el resultado. Por eso se controla todo lo demás."),
 ()=>mc("¿Cuál es la mejor <b>hipótesis</b> para el experimento de la Elodea y la luz?","Si acerco la lámpara a la Elodea, entonces saldrán más burbujas de oxígeno, porque con más luz la planta hace más fotosíntesis",["La Elodea es una planta acuática","Voy a contar burbujas con una lámpara","Las plantas necesitan agua"],"Una hipótesis es una predicción comprobable: <b>Si</b> (cambio la VI) <b>entonces</b> (pasa esto con la VD) <b>porque</b> (explicación científica)."),
 ()=>mc("¿Cuál es una buena <b>pregunta de investigación</b>?","¿Cómo afecta la cantidad de agua de riego al número de frutos de una planta de tomate?",["¿Las plantas son bonitas?","¿Cuántos tomates hay en Chile?","Los tomates son frutos."],"Una buena pregunta incluye las dos variables: ¿Cómo afecta <b>la VI</b> a <b>la VD</b>?"),
 ()=>mc("¿Por qué se hacen <b>varios ensayos</b> (repeticiones) de cada medición?","Para que los resultados sean más confiables y poder calcular un promedio",["Para que la tabla se vea más larga","Porque el primer intento siempre está malo","Para cambiar la variable independiente"],"Repetir reduce el efecto de errores casuales. Con 3 ensayos se calcula el promedio, que representa mejor el resultado."),
 ()=>mc("En la fotosíntesis, ¿qué gas libera la planta (y forma las burbujas en la Elodea)?","Oxígeno",["Dióxido de carbono","Nitrógeno","Vapor de agua solamente"],"Fotosíntesis: agua + dióxido de carbono + luz → glucosa + <b>oxígeno</b>. Las burbujas son oxígeno.")
];
function genVarMode(){return Math.random()<.65?genVariable():rnd(CONCEPT)()}

function trials(base,spread){return [0,0,0].map(()=>Math.max(1,base+ri(-spread,spread)))}
const AVGCTX=[
 {t:"Número de burbujas de O₂ por minuto de una Elodea (lámpara a 10 cm)",u:"burbujas",b:[14,24]},
 {t:"Altura de una planta de poroto (cm) a las 3 semanas",u:"cm",b:[10,25]},
 {t:"Número de frutos de una planta de tomate",u:"frutos",b:[6,15]},
 {t:"Masa de una frutilla (g)",u:"g",b:[12,22]},
 {t:"Días que tarda en madurar un plátano a 20 °C",u:"días",b:[5,9]}
];
function genAvg(){
 const c=rnd(AVGCTX);const n=Math.random()<.35?4:3;const base=ri(c.b[0],c.b[1]);
 if(Math.random()<.25){ // anómalo
  const v=trials(base,1);const an=base*2+ri(3,6);const all=shuffle([...v,an]);
  return mc(`${c.t}. Ensayos: <b>${all.join(" · ")}</b> ${c.u}. ¿Cuál es el <b>dato anómalo</b>?`,String(an),all.filter(x=>x!==an).map(String).concat(["Ninguno"]),`El ${an} se aleja mucho de los demás (cerca de ${base}). Un dato anómalo se revisa o se repite, y no se usa para el promedio.`)
 }
 const v=[];for(let i=0;i<n;i++)v.push(Math.max(1,base+ri(-3,3)));
 const sum=v.reduce((a,b)=>a+b,0);const avg=r1(sum/n);
 return {kind:"num",prompt:`${c.t}.<br>Ensayos: <b>${v.join(" · ")}</b><br>Calcula el <b>promedio</b> (${c.u}). Si tiene decimales, usa 1 decimal.`,answer:avg,expl:`Suma: ${v.join(" + ")} = ${sum}. Divide por ${n} ensayos: ${sum} ÷ ${n} = <b>${fmt(avg)}</b> ${c.u}.`};
}

const TBL=[
 {t:"Efecto de la distancia a la lámpara en las burbujas de O₂ de la Elodea",vi:"Distancia (cm)",vd:"Burbujas por minuto",rows:[10,20,30,40],f:i=>28-i*6},
 {t:"Efecto de la cantidad de agua en el número de frutos de tomate",vi:"Agua (mL/día)",vd:"Número de frutos",rows:[100,200,300],f:i=>6+i*4},
 {t:"Efecto de la temperatura en la maduración del plátano",vi:"Temperatura (°C)",vd:"Días en madurar",rows:[5,15,25],f:i=>14-i*4},
 {t:"Efecto de las horas de luz en la altura de la planta",vi:"Horas de luz al día",vd:"Altura (cm)",rows:[4,8,12],f:i=>8+i*5}
];
function genTable(){
 const t=rnd(TBL);const data=t.rows.map((r,i)=>{const b=t.f(i);const v=[b+ri(-2,2),b+ri(-2,2),b+ri(-2,2)].map(x=>Math.max(1,x));return {r,v,avg:r1((v[0]+v[1]+v[2])/3)}});
 return {kind:"table",t,data,prompt:`Completa la columna <b>Promedio</b> de la tabla de datos elaborados (1 decimal si hace falta).`,expl:data.map(d=>`${d.r}: (${d.v.join("+")})÷3 = <b>${fmt(d.avg)}</b>`).join("<br>")};
}
const TABLEQ=[
 ()=>mc("En una tabla de datos, ¿dónde va la variable independiente?","En la primera columna (a la izquierda)",["En la última columna","En el título solamente","No se anota"],"Orden: VI a la izquierda → ensayos de la VD → promedio a la derecha."),
 ()=>mc("¿Qué le falta a esta tabla? <br><table><tr><th>Agua</th><th>Frutos</th></tr><tr><td>100</td><td>6</td></tr><tr><td>200</td><td>10</td></tr></table>","Las unidades (por ejemplo, mL/día) y un título",["Más colores","Una columna con el nombre de Ema","Nada, está perfecta"],"Toda tabla necesita <b>título</b> y <b>unidades</b> en los encabezados: “Agua (mL/día)”."),
 ()=>mc("¿Qué diferencia hay entre datos brutos y datos elaborados?","Los brutos son las mediciones tal cual; los elaborados están procesados (por ejemplo, promedios)",["Son lo mismo","Los elaborados son inventados","Los brutos son los datos equivocados"],"Datos <b>brutos</b> = lo que mediste en cada ensayo. Datos <b>elaborados/procesados</b> = cálculos con ellos, como el promedio.")
];
function genTableMode(){return Math.random()<.7?genTable():rnd(TABLEQ)()}

function genGraph(){
 const k=ri(0,5);
 if(k===0){const vals=[ri(28,34),ri(20,24),ri(13,17),ri(5,9)];return mc("Según el gráfico, ¿qué pasa con las burbujas cuando aumenta la distancia a la lámpara?","A mayor distancia, menos burbujas (menos fotosíntesis)",["A mayor distancia, más burbujas","No cambia nada","Primero suben y luego bajan"],"La línea baja: cuando la lámpara está más lejos llega menos luz y la planta hace menos fotosíntesis.",{svg:chart({type:"line",labels:["10","20","30","40"],values:vals,title:"Burbujas de O₂ según la distancia a la lámpara",xl:"Distancia a la lámpara (cm)",yl:"Burbujas por minuto",ymax:35,step:5})})}
 if(k===1){const v=[ri(8,12),ri(16,20),ri(12,15)];return mc("Según el gráfico, ¿con qué fertilizante creció más la planta?","Fertilizante B",["Fertilizante A","Fertilizante C","Sin fertilizante"],`La barra más alta es B (${v[1]} cm).`,{svg:chart({type:"bar",labels:["A","B","C"],values:v,title:"Altura de la planta según el fertilizante",xl:"Tipo de fertilizante",yl:"Altura promedio (cm)",ymax:25,step:5})})}
 if(k===2){const st=ri(2,4),v=[4,4+st,4+2*st,4+3*st],j=ri(0,3),lb=["100","200","300","400"];return {kind:"num",prompt:`Según el gráfico, ¿cuántos frutos en promedio tuvo la planta regada con <b>${lb[j]} mL</b>?`,answer:v[j],expl:`Busca ${lb[j]} en el eje X, sube hasta el punto y mira el eje Y: <b>${v[j]}</b> frutos.`,svg:chart({type:"line",labels:["100","200","300","400"],values:v,title:"Frutos de tomate según el agua de riego",xl:"Agua de riego (mL/día)",yl:"Número de frutos",ymax:20,step:4})}}
 if(k===3){const v=[ri(13,16),ri(9,11),ri(4,7)];return {kind:"num",prompt:"Según el gráfico, ¿cuántos días <b>más</b> tarda en madurar el plátano a 5 °C que a 25 °C?",answer:v[0]-v[2],expl:`A 5 °C: ${v[0]} días. A 25 °C: ${v[2]} días. ${v[0]} − ${v[2]} = <b>${v[0]-v[2]}</b> días.`,svg:chart({type:"bar",labels:["5 °C","15 °C","25 °C"],values:v,title:"Días de maduración del plátano según la temperatura",xl:"Temperatura (°C)",yl:"Días en madurar",ymax:16,step:2})}}
 if(k===4)return mc("¿Qué conclusión es correcta según el gráfico?","A más horas de luz, mayor altura de la planta",["La luz no afecta a la planta","A más horas de luz, menor altura","La planta mide 25 cm con 4 horas"],"La línea sube de izquierda a derecha: tendencia positiva (a mayor VI, mayor VD).",{svg:chart({type:"line",labels:["4","8","12","16"],values:[ri(6,9),ri(11,14),ri(16,19),ri(21,24)],title:"Altura de la planta según las horas de luz",xl:"Horas de luz al día",yl:"Altura (cm)",ymax:25,step:5})});
 return mc("En este gráfico, ¿cuál es la variable dependiente?","La masa de los frutos (g)",["Las horas de luz","El título","La escala"],"La dependiente va en el <b>eje Y</b> (vertical): masa de los frutos.",{svg:chart({type:"bar",labels:["4 h","8 h","12 h"],values:[ri(8,11),ri(13,16),ri(17,20)],title:"Masa de frutillas según horas de luz",xl:"Horas de luz al día",yl:"Masa promedio del fruto (g)",ymax:20,step:5})});
}

function genParts(){
 const k=ri(0,9);
 if(k===7)return mc("¿Qué gráfico conviene para comparar el número de frutos de 3 variedades de tomate (Cherry, Limachino, Italiano)?","Gráfico de barras",["Gráfico de líneas","Ningún gráfico","Un gráfico con la variedad en el eje Y"],"Las variedades son <b>categorías</b> → barras.");
 if(k===8)return mc("¿Qué gráfico conviene para mostrar la altura de una planta medida cada semana (semana 1, 2, 3, 4, 5)?","Gráfico de líneas",["Gráfico de barras de colores","Gráfico circular","Una lista de palabras"],"El tiempo es <b>continuo</b> → líneas, para ver cómo cambia.");
 if(k===9)return mc("¿Cuál es el mejor <b>título</b> para un gráfico de altura de la planta según el tipo de fertilizante?","Altura de la planta (cm) según el tipo de fertilizante",["Mi gráfico","Plantas","Experimento de Ema"],"El título dice qué relación muestra: <b>VD según VI</b>.");
 if(k===0)return mc("¿Qué gráfico conviene para comparar la altura con fertilizante A, B y C?","Gráfico de barras",["Gráfico de líneas","Gráfico circular","Ninguno"],"A, B y C son <b>categorías</b> (no números continuos) → gráfico de <b>barras</b>.");
 if(k===1)return mc("¿Qué gráfico conviene para mostrar burbujas según la distancia (10, 20, 30, 40 cm)?","Gráfico de líneas",["Gráfico de barras separado por colores","Gráfico circular","Una tabla sin números"],"La distancia es un número <b>continuo</b> que va aumentando → gráfico de <b>líneas</b> para ver la tendencia.");
 if(k===2)return mc("¿Qué error tiene este gráfico?","Los rótulos de los ejes no tienen unidades",["Le falta el título","Los ejes están invertidos","Tiene demasiados datos"],"“Agua” y “Frutos” no dicen en qué se midió. Debe decir “Agua (mL/día)” y “Número de frutos”.",{svg:chart({type:"line",labels:["100","200","300"],values:[6,10,14],title:"Frutos de tomate según el agua de riego",xl:"Agua",yl:"Frutos",ymax:16,step:4})});
 if(k===3)return mc("¿Qué error tiene este gráfico?","Los ejes están invertidos: la independiente (distancia) debería ir en el eje X",["Le faltan las unidades","No tiene título","Debería ser circular"],"Regla: <b>X = independiente</b> (lo que cambio), <b>Y = dependiente</b> (lo que mido). Aquí la distancia quedó en el eje Y.",{svg:chart({type:"line",labels:["30","22","15","8"],values:[10,20,30,40],title:"Burbujas de O₂ según la distancia a la lámpara",xl:"Burbujas por minuto",yl:"Distancia a la lámpara (cm)",ymax:45,step:5})});
 if(k===4)return mc("¿Qué error tiene este gráfico?","Le falta el título",["Los ejes están invertidos","Le faltan unidades","La escala no parte en 0"],"Todo gráfico necesita un <b>título</b> que diga qué relación muestra: “VD según VI”.",{svg:chart({type:"bar",labels:["5 °C","15 °C","25 °C"],values:[14,10,6],title:"",xl:"Temperatura (°C)",yl:"Días en madurar",ymax:16,step:2})});
 if(k===5)return mc("¿En qué eje va la variable dependiente?","En el eje Y (vertical)",["En el eje X (horizontal)","En el título","En la leyenda"],"X → independiente. Y → dependiente. Truco: “la Y es lo que Yo mido”.");
 return mc("¿Qué debe tener una buena escala en un eje?","Intervalos iguales (por ejemplo 0, 5, 10, 15…)",["Números al azar","Solo el número más grande","Intervalos distintos para que quepa todo"],"La escala debe avanzar de a saltos <b>iguales</b>; si no, el gráfico engaña.");
}

/* Ensayo de laboratorio: secuencia fija con datos al azar */
function genLab(){
 const w=[100,200,300];const raw=w.map((x,i)=>{const b=6+i*4;return [b+ri(-1,2),b+ri(-1,2),b+ri(-1,2)]});
 const av=raw.map(v=>r1((v[0]+v[1]+v[2])/3));
 const ctx=`<b>Laboratorio:</b> Ema quiere saber si la cantidad de agua afecta la producción de frutos del tomate. Riega 9 plantas iguales: 3 con 100 mL, 3 con 200 mL y 3 con 300 mL al día, en el mismo lugar soleado y con la misma tierra. Después de 8 semanas cuenta los frutos de cada planta.`;
 const tbl=`<table><tr><th>Agua (mL/día)</th><th>Planta 1</th><th>Planta 2</th><th>Planta 3</th></tr>${w.map((x,i)=>`<tr><td>${x}</td><td>${raw[i].join("</td><td>")}</td></tr>`).join("")}</table>`;
 const s=raw[1].reduce((a,b)=>a+b,0);
 const qs=[
  mc("Paso 1 · ¿Cuál es la pregunta de investigación?","¿Cómo afecta la cantidad de agua de riego al número de frutos de la planta de tomate?",["¿Cuántas plantas tiene Ema?","¿Los tomates son rojos?","¿Cómo afecta el sol a la tierra?"],"La pregunta une la VI (agua) con la VD (número de frutos).",{ctx}),
  mc("Paso 2 · ¿Cuál es la variable independiente?","La cantidad de agua (mL/día)",["El número de frutos","El tipo de tierra","Las 8 semanas"],"Es lo que Ema cambia: 100, 200 o 300 mL.",{ctx}),
  mc("Paso 3 · ¿Cuál es la variable dependiente?","El número de frutos por planta",["La cantidad de agua","El lugar soleado","La cantidad de plantas"],"Es lo que Ema mide al final.",{ctx}),
  mc("Paso 4 · ¿Cuál NO es una variable controlada?","La cantidad de agua de riego",["El tipo de tierra","La luz (mismo lugar)","La variedad de tomate"],"El agua es la independiente: la que cambia. Las demás se mantienen iguales.",{ctx}),
  mc("Paso 5 · ¿Cuál es la mejor hipótesis?","Si riego con más agua, entonces la planta dará más frutos, porque el agua es necesaria para la fotosíntesis y el crecimiento",["Los tomates tendrán frutos","Si riego, la planta es verde","Voy a regar tomates"],"Si (VI)… entonces (VD)… porque (razón científica: el agua es materia prima de la fotosíntesis).",{ctx}),
  mc("Paso 6 · ¿Por qué usa 3 plantas por cada cantidad de agua?","Para repetir la medición y obtener un promedio más confiable",["Porque tenía 9 maceteros","Para cambiar la tierra","Para que sea más difícil"],"Las repeticiones hacen el resultado más confiable.",{ctx}),
  {kind:"num",prompt:`Paso 7 · Datos brutos (número de frutos):${tbl}Calcula el <b>promedio de frutos con 200 mL</b>.`,answer:av[1],expl:`(${raw[1].join(" + ")}) ÷ 3 = ${s} ÷ 3 = <b>${fmt(av[1])}</b>.`},
  mc(`Paso 8 · Los promedios fueron ${fmt(av[0])}, ${fmt(av[1])} y ${fmt(av[2])} frutos. ¿Qué gráfico y ejes usa?`,"Gráfico de líneas o barras con agua (mL/día) en el eje X y número de frutos en el eje Y",["Agua en el eje Y y frutos en el eje X","Un gráfico circular con los nombres de las plantas","No hace falta gráfico"],"X = independiente (agua), Y = dependiente (frutos). Como el agua es numérica, una línea muestra bien la tendencia (barras también se aceptan con pocos valores)."),
  mc("Paso 9 · ¿Qué conclusión corresponde?","A mayor cantidad de agua, mayor número de frutos en promedio; la hipótesis se apoya",["El agua no influye","A más agua, menos frutos","La hipótesis queda rechazada"],`Los promedios suben (${fmt(av[0])} → ${fmt(av[1])} → ${fmt(av[2])}), así que los datos apoyan la hipótesis.`),
  mc("Paso 10 · ¿Cuál es una buena mejora para el experimento?","Usar más plantas por grupo y probar más cantidades de agua (por ejemplo 400 y 500 mL)",["Usar tierras distintas en cada maceta","Contar los frutos solo de una planta","Cambiar el lugar de las plantas cada día"],"Mejorar = más repeticiones, más valores de la VI y mantener bien controladas las variables. Cambiar tierra o lugar arruinaría la prueba justa.")
 ];return qs;
}

const MODES=[
 {id:"var",ic:"🔍",n:"¿Qué variable es?",d:"Independiente, dependiente, controladas, hipótesis",g:genVarMode,len:10},
 {id:"avg",ic:"➗",n:"Calcula el promedio",d:"Suma, divide y detecta el dato anómalo",g:genAvg,len:8},
 {id:"tbl",ic:"📋",n:"Arma la tabla elaborada",d:"De datos brutos a la columna de promedios",g:genTableMode,len:8},
 {id:"gra",ic:"📈",n:"Lee el gráfico",d:"Tendencias, valores y conclusiones",g:genGraph,len:8},
 {id:"par",ic:"🧭",n:"¿Qué gráfico usar?",d:"Barras o líneas, ejes, títulos y errores",g:genParts,len:8},
 {id:"lab",ic:"🧪",n:"Ensayo de laboratorio",d:"Un experimento completo de frutos, paso a paso",g:null,len:10}
];
const best=JSON.parse(localStorage.getItem("varEmaBest")||"{}");
let S=null;

function menu(){
 app.innerHTML=`<div class="hero"><div class="deco">🔬</div><div class="tag">Ciencias · 6° básico · Laboratorio B y C</div><h1>Científica en Acción</h1><p>Variables, tablas de datos, promedios y gráficos para el laboratorio de fotosíntesis y plantas.</p></div>
 <div class="menu">${MODES.map((m,i)=>`<button class="mbtn" data-m="${i}"><span class="ic">${m.ic}</span><span class="tx"><b>${m.n}</b><small>${m.d}</small></span>${best[m.id]!=null?`<span class="best">★ ${best[m.id]}%</span>`:""}</button>`).join("")}
 <button class="mbtn" id="sumBtn"><span class="ic">📘</span><span class="tx"><b>Resumen para repasar</b><small>Lo esencial en una página</small></span></button></div>`;
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(+b.dataset.m));
 $("#sumBtn").onclick=summary;window.scrollTo(0,0);
}
function start(i){
 const m=MODES[i];let qs;
 if(m.id==="lab")qs=genLab();else{qs=[];const seen=new Set();let tries=0;while(qs.length<m.len&&tries<200){tries++;const q=m.g();const key=q.prompt+(q.ctx||"")+(q.svg||"")+(q.kind==="table"?Math.random():"");if(seen.has(key))continue;seen.add(key);qs.push(q)}}
 S={m,qs,i:0,pts:0,ok:0,streak:0,bestStreak:0,mist:[]};render();
}
function header(){const p=S.i/S.qs.length*100;return `<div class="top"><button class="pill" id="back">← Menú</button><span class="pill">⭐ ${S.pts}</span><span class="pill">🔥 ${S.streak}</span><span class="pill">${S.i+1}/${S.qs.length}</span></div><div class="bar"><i style="width:${p}%"></i></div>`}
function render(){
 const q=S.qs[S.i];let body="";
 if(q.ctx)body+=`<div class="ctx">${q.ctx}</div>`;
 body+=`<div class="q">${q.prompt}</div>`;if(q.svg)body+=`<div style="margin-top:10px">${q.svg}</div>`;
 if(q.kind==="mc")body+=`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
 if(q.kind==="num")body+=`<div class="center" style="margin-top:12px"><input class="num" id="ans" inputmode="decimal" autocomplete="off" placeholder="?"> </div><button class="big" id="chk">Comprobar</button>`;
 if(q.kind==="table")body+=`<p class="small" style="margin-top:8px"><b>${esc(q.t.t)}</b></p><table><tr><th>${q.t.vi}</th><th>Ensayo 1</th><th>Ensayo 2</th><th>Ensayo 3</th><th>Promedio</th></tr>${q.data.map((d,k)=>`<tr><td><b>${d.r}</b></td><td>${d.v[0]}</td><td>${d.v[1]}</td><td>${d.v[2]}</td><td><input class="num" data-r="${k}" inputmode="decimal" autocomplete="off"></td></tr>`).join("")}</table><p class="small">Variable dependiente: ${q.t.vd}</p><button class="big" id="chk">Comprobar</button>`;
 app.innerHTML=header()+`<div class="card">${body}<div id="fb"></div></div>`;
 $("#back").onclick=menu;
 if(q.kind==="mc")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.k];const good=o===q.answer;app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.options[+x.dataset.k]===q.answer)x.classList.add("ok")});if(!good)b.classList.add("bad");done(good,o,q.answer)});
 if(q.kind==="num"){const inp=$("#ans");const go=()=>{const v=parseNum(inp.value);if(isNaN(v)){inp.focus();return}const good=near(v,q.answer);inp.classList.add(good?"ok":"bad");inp.disabled=true;done(good,inp.value,fmt(q.answer))};$("#chk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};inp.focus()}
 if(q.kind==="table"){$("#chk").onclick=()=>{const ins=[...app.querySelectorAll("td input")];if(ins.some(x=>isNaN(parseNum(x.value)))){alert("Completa todos los promedios con números.");return}let all=true;ins.forEach(x=>{const d=q.data[+x.dataset.r];const g=near(parseNum(x.value),d.avg);x.classList.add(g?"ok":"bad");x.disabled=true;if(!g)all=false});done(all,ins.map(x=>x.value).join(" / "),q.data.map(d=>fmt(d.avg)).join(" / "))}}
}
function done(good,given,correct){
 const q=S.qs[S.i];
 if(good){S.ok++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);S.pts+=10+Math.min(S.streak-1,5)*2}else{S.streak=0;S.mist.push({q:q.prompt.replace(/<table[\s\S]*<\/table>/,"[tabla]"),given,correct,expl:q.expl})}
 const btn=$("#chk");if(btn)btn.remove();
 $("#fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><b>${good?"¡Correcto! ✅":"No era esa ❌ — Respuesta: "+correct}</b><br>${q.expl}</div><button class="big" id="next">${S.i+1<S.qs.length?"Siguiente →":"Ver resultado"}</button>`;
 $("#next").onclick=()=>{S.i++;if(S.i<S.qs.length)render();else end()};
 $("#next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){
 const pc=Math.round(S.ok/S.qs.length*100);if(best[S.m.id]==null||pc>best[S.m.id]){best[S.m.id]=pc;localStorage.setItem("varEmaBest",JSON.stringify(best))}
 const msg=pc>=90?"¡Lista para el laboratorio! 🏆":pc>=70?"¡Muy bien! Revisa los errores y vuelve a jugar.":"Repasa el resumen y vuelve a intentarlo 💪";
 app.innerHTML=`<div class="card center"><h2>${S.m.ic} ${S.m.n}</h2><div class="score">${S.ok}/${S.qs.length}</div><p><b>${pc}%</b> · ⭐ ${S.pts} puntos · mejor racha 🔥 ${S.bestStreak}</p><p>${msg}</p></div>
 ${S.mist.length?`<div class="card"><h2>Para repasar</h2>${S.mist.map(m=>`<div class="mist"><div>${m.q}</div><div><b>Tu respuesta:</b> ${esc(m.given)} · <b>Correcta:</b> ${m.correct}</div><div class="small">${m.expl}</div></div>`).join("")}</div>`:""}
 <button class="big" id="again">Jugar de nuevo</button><button class="big alt" id="home">Volver al menú</button>`;
 $("#again").onclick=()=>start(MODES.indexOf(S.m));$("#home").onclick=menu;window.scrollTo(0,0);
}
function summary(){
 app.innerHTML=`<div class="top"><button class="pill" id="back">← Menú</button></div><div class="card sum">
 <h3>1. Variables</h3><ul><li><b>Independiente (VI):</b> la que <b>yo cambio</b>. Ej: distancia a la lámpara, tipo de fertilizante, agua de riego.</li><li><b>Dependiente (VD):</b> la que <b>mido</b> (el resultado). Ej: burbujas de O₂, altura, número de frutos.</li><li><b>Controladas:</b> las que <b>mantengo iguales</b> para que la prueba sea justa (tipo de planta, tierra, temperatura…).</li></ul>
 <h3>2. Pregunta e hipótesis</h3><ul><li>Pregunta: <i>¿Cómo afecta [VI] a [VD]?</i></li><li>Hipótesis: <i><b>Si</b> aumento [VI], <b>entonces</b> [VD] aumentará/disminuirá, <b>porque</b> [razón científica].</i></li></ul>
 <h3>3. Tablas de datos</h3><ul><li>Título + encabezados con <b>unidades</b>: “Agua (mL/día)”.</li><li>VI en la columna <b>izquierda</b>; ensayos 1, 2, 3 de la VD; promedio a la derecha.</li><li><b>Datos brutos</b> = mediciones tal cual. <b>Datos elaborados</b> = procesados (promedios).</li></ul>
 <h3>4. Promedio</h3><ul><li>Sumo todos los ensayos y divido por la cantidad de ensayos.</li><li>Ej: (12 + 14 + 13) ÷ 3 = 39 ÷ 3 = <b>13</b>. (10 + 11 + 11) ÷ 3 = 32 ÷ 3 ≈ <b>10,7</b>.</li><li><b>Dato anómalo:</b> el que se aleja mucho de los demás; se revisa o se repite y no entra al promedio.</li><li>Se repite el experimento para que el resultado sea <b>confiable</b>.</li></ul>
 <h3>5. Gráficos</h3><ul><li><b>Barras</b>: VI en categorías (fertilizante A, B, C). <b>Líneas</b>: VI numérica continua (10, 20, 30 cm).</li><li><b>Eje X = VI</b>, <b>eje Y = VD</b> (“la Y es lo que Yo mido”).</li><li>Necesita <b>título</b> (“VD según VI”), <b>rótulos con unidades</b> y <b>escala con saltos iguales</b>.</li><li>Grafico los <b>promedios</b>.</li></ul>
 <h3>6. Analizar y evaluar</h3><ul><li>Tendencia: “A mayor [VI], mayor/menor [VD]”. Uso números del gráfico.</li><li>Conclusión: ¿los datos <b>apoyan</b> o <b>refutan</b> mi hipótesis? Explico con ciencia (más luz → más fotosíntesis → más O₂ y glucosa).</li><li>Mejoras: más repeticiones, más valores de la VI, controlar mejor las variables, medir con más precisión.</li></ul>
 <h3>Fotosíntesis (recuerda)</h3><p>agua + dióxido de carbono + <b>luz</b> → glucosa + <b>oxígeno</b> (ocurre en los cloroplastos, con clorofila).</p></div><button class="big" id="home">Volver al menú</button>`;
 $("#back").onclick=menu;$("#home").onclick=menu;window.scrollTo(0,0);
}
menu();
</script>
</body>
</html>
